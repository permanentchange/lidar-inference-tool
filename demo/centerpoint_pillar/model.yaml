version: v6.1
file_list: ['end2end.engine', 'model.yaml']
model:
  engine_path: end2end.engine
  decode_mode: centerpoint_mmdeploy
  # yaw_encoding controls how yaw is reconstructed from model outputs:
  # - sin_cos: dir_cls_pred stores [sin(yaw), cos(yaw)]
  # - direction_theta: bbox_pred stores theta after dim, and dir_cls_pred stores
  #   2-way direction logits
  yaw_encoding: direction_theta
  num_point_features: 5
  point_cloud_range: [-8.0, -8.0, -2.0, 16.0, 8.0, 4.0]
  post_center_range: [-10.0, -10.0, -2.0, 18.0, 10.0, 4.0]
  pillar_size: [0.05, 0.05, 6.0]
  out_size_factor: 4
  bbox_code_size: 9
  norm_bbox: true
  has_velocity: true
  # Label ids below are global label ids, matching train.py class_names.
  # C++ decode uses task_label_ids to map ONNX task-local channels back to
  # these global ids, matching mmdetection3d CenterHead._map_task_labels_to_global.
  label_names:
    - "vehicle.electric_two_wheeler.unridden" # global 0
    - "human.pedestrian" # global 1
    - "vehicle.electric_two_wheeler.ridden" # global 2
    - "vehicle.bicycle.unridden" # global 3
    - "vehicle.general" # global 4
    - "vehicle.sightseeing" # global 5
    - "vehicle.bicycle.ridden" # global 6
    - "vehicle.tricycle.unridden" # global 7
    - "vehicle.tricycle.ridden" # global 8
  # Number of classes per CenterPoint task, in the same task order as train.py.
  task_num_classes: [2, 1, 2, 1, 1, 2]
  # Global label ids per CenterPoint task. This matches train.py:
  # task_label_groups = [[0, 2], [1], [3, 6], [4], [5], [7, 8]]
  # Each ONNX task-local class is mapped through this table before postprocess.
  task_label_ids:
    - [0, 2] # task0: electric_two_wheeler un/ridden
    - [1] # task1: pedestrian
    - [3, 6] # task2: bicycle un/ridden
    - [4] # task3: vehicle.general
    - [5] # task4: vehicle.sightseeing
    - [7, 8] # task5: tricycle un/ridden

runtime:
  max_points_per_pillar: 20
  min_pillars: 100
  max_pillars: 50000
  max_points: 300000
  frame_num: 1
  bbox_max_num: 500
  score_threshold: 0.1

postprocess:
  self_car_box: [0.7, 0.0, 0.0, 1.8, 1.4, 0.2, 0.0] # x, y, z, dx, dy, dz, yaw
  self_car_nms_thresh: 0.01
  nms_thresh: 0.2
  nms_pre_maxsize: 1000
  nms_post_maxsize: 83
  final_score_threshold: 0.3
  # Global-label order. Values match train.py deploy_label_score_thresh.
  # precision >= 0.8
  # recall >= 0.7 recall >=0.6
  label_score_thresh: [0.35, 0.35, 0.4, 0.4, 0.3, 0.4, 0.5, 0.4, 0.4]
  # Global-label order, same indexing as label_score_thresh.
  
  nms_type: "iou_min_bev"
  nms_label_groups:
    # labels are global label ids. This group intentionally merges
    # electric two-wheelers and bicycles into the final "bicycle" class.
    - labels: [0, 1, 2, 3, 4, 5, 6, 7, 8]
      nms_thresh: 0.3
      nms_pre_maxsize: 500
      nms_post_maxsize: 50

  # Global label id -> mapped label id used in final result.json and
  # visualization. Mapped ids are defined by mapped_label_names below.
  label_mapping: [0, 1, 0, 0, 3, 4, 0, 2, 2]
  # Final business labels after merging ridden/unridden subclasses.
  mapped_label_names:
    - "bi" # 0
    - "ped" # 1
    - "tri" # 2
    - "car" # 3
    - "sight" # 4
