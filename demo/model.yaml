model:
  engine_path: "end2end.engine"
  decode_mode: "centerpoint_mmdeploy"
  num_point_features: 5
  point_cloud_range: [-10.0, -15.0, -5.0, 20.4, 15.4, 3.0]
  post_center_range: [-15.0, -20.0, -10.0, 25.4, 20.4, 10.0]
  pillar_size: [0.1, 0.1, 8.0]
  out_size_factor: 4
  bbox_code_size: 9
  norm_bbox: true
  has_velocity: true
  label_names:
    - "vehicle.electric_two_wheeler.unridden" # 0
    - "human.pedestrian" # 1
    - "vehicle.electric_two_wheeler.ridden" # 2
    - "vehicle.bicycle.unridden" # 3
    - "vehicle.general" # 4
    - "vehicle.sightseeing" # 5
    - "vehicle.bicycle.ridden" # 6
    - "vehicle.tricycle.unridden" # 7
    - "vehicle.tricycle.ridden" # 8
  task_num_classes: [2, 1, 2, 1, 1, 2]

runtime:
  max_points_per_pillar: 20
  min_pillars: 100
  max_pillars: 50000
  max_points: 300000
  frame_num: 1
  bbox_max_num: 500
  score_threshold: 0.1

postprocess:
  nms_type: "iou_bev"
  nms_thresh: 0.2
  nms_pre_maxsize: 1000
  nms_post_maxsize: 83
  final_score_threshold: 0.3
  label_score_thresh: [0.35, 0.4, 0.3, 0.5, 0.2, 0.35, 0.4, 0.3, 0.25]
  circle_nms_min_radius: [0.8, 0.4, 0.8, 0.6, 2.0, 1.5, 0.6, 1.5, 1.5]
  nms_label_groups:
    - labels: [0, 2]
      nms_thresh: 0.25
      nms_pre_maxsize: 500
      nms_post_maxsize: 50
    - labels: [1]
      nms_thresh: 0.4
      nms_pre_maxsize: 500
      nms_post_maxsize: 50
    - labels: [3, 6]
      nms_thresh: 0.3
      nms_pre_maxsize: 500
      nms_post_maxsize: 50
    - labels: [4]
      nms_thresh: 0.3
      nms_pre_maxsize: 500
      nms_post_maxsize: 50
    - labels: [5]
      nms_thresh: 0.2
      nms_pre_maxsize: 500
      nms_post_maxsize: 50
    - labels: [7, 8]
      nms_thresh: 0.2
      nms_pre_maxsize: 500
      nms_post_maxsize: 50
  label_mapping: [0, 1, 0, 2, 4, 5, 2, 3, 3]
  mapped_label_names:
    - "ebicycle" # 0
    - "pedestrian" # 1
    - "bicycle" # 2
    - "tricycle" # 3
    - "car" # 4
    - "sightseeing" # 5
