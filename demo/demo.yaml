# These example paths are resolved relative to this YAML file.
engine_path: "end2end.engine"
pcd_path: "pcd.bin"
dump_dir: "../outputs/demo_dump"
warmup_iters: 10
profile_iters: 100
bev_resolution: 0.1

runtime:
  max_points: 300000
  frame_num: 1
  num_point_features: 5
  point_cloud_range: [-25.6, -25.6, -5.0, 25.6, 25.6, 3.0]
  post_center_range: [-35.6, -35.6, -10.0, 35.6, 35.6, 10.0]
  pillar_size: [0.1, 0.1, 8.0]
  max_points_per_pillar: 20
  min_pillars: 100
  max_pillars: 50000
  bbox_max_num: 500
  out_size_factor: 4
  score_threshold: 0.1

post_processing:
  nms_type: "circle"
  nms_thresh: 0.2
  nms_pre_maxsize: 1000
  nms_post_maxsize: 83
  final_score_threshold: 0.3
  circle_nms_min_radius: [4.0, 22.0, 10.0]
  label_names: ["car", "per", "cyc"]
  label_score_thresh:
    "1": 0.30
    "2": 0.30
    "3": 0.30
