version: v8.0
file_list:
- centerpoint.scn.onnx
- rpn_centerhead.engine
- model.yaml
model:
  runtime_backend: centerpoint_voxel
  scn_onnx_path: centerpoint.scn.onnx
  head_engine_path: rpn_centerhead.engine
  decode_mode: centerpoint_mmdeploy
  yaw_encoding: sin_cos
  num_point_features: 5
  point_cloud_range:
  - -8.0
  - -8.0
  - -1.0
  - 16.0
  - 8.0
  - 3.0
  post_center_range:
  - -10.0
  - -10.0
  - -1.0
  - 18.0
  - 10.0
  - 3.0
  voxel_size:
  - 0.05
  - 0.05
  - 0.1
  sparse_shape:
  - 41
  - 320
  - 480
  out_size_factor: 8
  bbox_code_size: 9
  norm_bbox: true
  has_velocity: true
  label_names:
  - vehicle.electric_two_wheeler.unridden
  - human.pedestrian
  - vehicle.electric_two_wheeler.ridden
  - vehicle.bicycle.unridden
  - vehicle.general
  - vehicle.sightseeing
  - vehicle.bicycle.ridden
  - vehicle.tricycle.unridden
  - vehicle.tricycle.ridden
  task_num_classes:
  - 2
  - 1
  - 2
  - 1
  - 1
  - 2
  task_label_ids:
  - - 0
    - 2
  - - 1
  - - 3
    - 6
  - - 4
  - - 5
  - - 7
    - 8
runtime:
  max_points_per_voxel: 16
  min_voxels: 100
  max_voxels: 100000
  max_points: 300000
  frame_num: 1
  bbox_max_num: 500
  score_threshold: 0.1
postprocess:
  self_car_box:
  - 0.7
  - 0.0
  - 0.0
  - 1.8
  - 1.4
  - 0.2
  - 0.0
  self_car_nms_thresh: 0.01
  nms_thresh: 0.2
  nms_pre_maxsize: 1000
  nms_post_maxsize: 83
  final_score_threshold: 0.3
  label_score_thresh:
  - 0.52
  - 0.63
  - 0.55
  - 0.6
  - 0.5
  - 0.1
  - 0.47
  - 0.4
  - 0.6
  nms_type: iou_min_bev
  nms_label_groups:
  - labels:
    - 0
    - 1
    - 2
    - 3
    - 4
    - 5
    - 6
    - 7
    - 8
    nms_thresh: 0.3
    nms_pre_maxsize: 500
    nms_post_maxsize: 50
  label_mapping:
  - 0
  - 1
  - 0
  - 0
  - 3
  - 4
  - 0
  - 2
  - 2
  mapped_label_names:
  - bi
  - ped
  - tri
  - car
  - sight
