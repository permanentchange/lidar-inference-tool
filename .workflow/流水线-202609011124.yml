version: "1.0"
name: 流水线-202609011124
displayName: 流水线-202609011124
stages:
- name: lidar工具打包
  displayName: lidar工具打包
  strategy: naturally
  trigger: auto
  steps:
  - step: shell@agent
    name: 6ef8f82c
    displayName: lidar工具打包推送
    schedulerType: DISTRIBUTED
    scriptType: SH
    script: |
      #!/bin/sh
      set -e

      work_dir="$(pwd)/.build-work"
      source_dir="$work_dir/lidar-inference-tool"
      tag="${REPO_REF:-${CI_COMMIT_REF_NAME:-${CI_COMMIT_REF_NAME_1:-}}}"

      if [ -z "$tag" ]; then
        tag="$(git describe --tags --exact-match HEAD 2>/dev/null || true)"
      fi

      rm -rf "$work_dir"
      mkdir -p "$work_dir"

      git clone --recursive \
        git@gitee.com:jiangsu-zhongke-zhichi_1/lidar-inference-tool.git \
        "$source_dir"

      cd "$source_dir"
      git fetch --tags origin

      if [ -z "$tag" ]; then
        tag="$(git tag --sort=-v:refname | head -n 1)"
      fi

      echo "构建 Tag: $tag"

      case "$tag" in
        [Vv]*.*.*-debug*) upload_channel="debug"; package_suffix="${tag#*-}" ;;
        [Vv]*.*.*-hotfix*) upload_channel="hotfix"; package_suffix="${tag#*-}" ;;
        [Vv]*.*.*) upload_channel="release"; package_suffix="" ;;
        *) echo "Tag 格式必须为 v1.1.1、v1.1.1-debug 或 v1.1.1-hotfix1"; exit 1 ;;
      esac

      git checkout "$tag"
      git submodule update --init --recursive

      chmod +x rebuild.sh
      ./rebuild.sh

      for deb in "$source_dir"/build/*.deb; do
        filename="$(basename "$deb")"

        if [ -n "$package_suffix" ]; then
          filename="${filename%.deb}-$package_suffix.deb"
        fi

        printf '%s\n' 'nvidia' | sudo -S -p '' dpkg -i "$deb"

        mc cp "$deb" \
          "igv_minio/packages/igv_modules/lidar_inference_tool/$upload_channel/$filename"
      done
    gitClone: "false"
    hostGroupID:
      ID: 打包专用
      hostID:
      - 6edc1c9e-cc59-4c40-8972-5f513528f0e8
    strategy:
      retry: "0"
triggers:
  trigger: auto
  push:
    tags:
      prefix:
      - v
      precise: []
      include:
      - '*v*'
notify: []
